{% extends 'base.html' %}

{% block title %}Register - Pet Adoption Portal{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3.5rem; padding-bottom: 5rem; max-width: 540px;">
    <div class="card" style="border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 56px; height: 56px; background: var(--primary-subtle); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.5rem;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Create Your Account</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Join our community to adopt or support shelter animals</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" id="register-form">
            <div class="form-group">
                <label class="form-label" for="reg-name">Full Name <span style="color: #ef4444;">*</span></label>
                <input type="text" name="name" id="reg-name" class="form-control" placeholder="e.g. Aparna Bhokare" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address <span style="color: #ef4444;">*</span></label>
                <input type="email" name="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-password">Password <span style="color: #ef4444;">*</span></label>
                <input type="password" name="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-phone">Phone Number</label>
                <input type="tel" name="phone" id="reg-phone" class="form-control" placeholder="e.g. 9876543210">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-address">Address & City</label>
                <input type="text" name="address" id="reg-address" class="form-control" placeholder="e.g. Pune, Maharashtra">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-role">Account Type</label>
                <select name="role" id="reg-role" class="form-control">
                    <option value="adopter">Pet Adopter / Foster Family</option>
                    <option value="staff">Shelter / NGO Staff Member</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" id="register-btn" style="width: 100%; margin-top: 1rem;">
                <i class="fas fa-check-circle"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
